apiVersion: apps/v1
kind: Deployment
metadata:
  name: transport-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transport-api
  template:
    metadata:
      labels:
        app: transport-api
    spec:
      containers:
      - name: transport-api
        image: transport-api:latest
        ports:
        - containerPort: 3000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: DATABASE_URL
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: transport-api
spec:
  selector:
    app: transport-api
  ports:
  - protocol: TCP
    port: 80
    targetPort: 3000
  type: ClusterIP
